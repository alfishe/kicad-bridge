[project]
name = "kicad-bridge"
version = "0.1.0"
description = "Minimalist search + invoke MCP bridge over the KiCad MCP Pro tool catalog."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.0",
]

[project.scripts]
kicad-bridge = "kicad_bridge.server:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
